name: Build OneiOS Metal for 24A446
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-metal.yml
      - patches/s25-plus-metal-runtime.patch
permissions:
  contents: read
jobs:
  metal:
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: runtime-source
    steps:
      - uses: actions/checkout@v4
        with:
          repository: akshaynexus/OneiOS
          ref: 7b81012615f2278460ffa3996aa56d6889277095
          path: runtime-source
      - name: Prepare the iPhoneOS and renderer build tools
        run: |
          xcrun --sdk iphoneos --show-sdk-version
          brew install ninja glslang shaderc spirv-tools bison llvm flex uv
          uv venv --python 3.13 "$RUNNER_TEMP/metal-venv"
          uv pip install --python "$RUNNER_TEMP/metal-venv/bin/python" meson mako pyyaml packaging
          echo "$RUNNER_TEMP/metal-venv/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
      - name: Fetch pinned renderer sources
        run: |
          bash kernel/fetch.sh Droid-VM-UniXNU
          bash scripts/setup/get-references.sh NativeMetal NativeAdreno NativeMobileDisplay AdrenoPM4 metal2vulkan mesa-droidvm
      - name: Generate link stubs from the 24A446 SystemOS cache
        run: |
          cargo build --release --locked --manifest-path tools/oneios-tool/Cargo.toml
          bash scripts/fetch/get-ipsw-cli.sh
          bash scripts/fetch/fetch.sh --only systemos profiles/ios-27.0.1-iPhone18,2.toml
          mount_dir="$(mktemp -d)"
          trap 'hdiutil detach -quiet "$mount_dir"; rmdir "$mount_dir"' EXIT
          hdiutil attach -readonly -nobrowse -noverify -noautoopen -owners off \
            -imagekey diskimage-class=CRawDiskImage -mountpoint "$mount_dir" inputs/24A446/043-70037-715.dmg
          cache="$mount_dir/System/Library/Caches/com.apple.dyld/dyld_shared_cache_arm64e"
          out/bin/ipsw dyld info --dylibs --json "$cache" > "$RUNNER_TEMP/24A446-libraries.json"
          python3 - "$RUNNER_TEMP/24A446-libraries.json" "$cache" <<'PY'
          import json
          import subprocess
          import sys
          frameworks = {
              "Accelerate", "CoreFoundation", "CoreGraphics", "CoreServices", "CoreVideo", "Foundation",
              "IOKit", "IOSurface", "Metal", "MetalPerformanceShaders", "QuartzCore", "Security",
          }
          with open(sys.argv[1]) as f:
              images = json.load(f)["dylibs"]
          libraries = []
          for image in images:
              name = image["name"]
              if name.startswith("/usr/lib/") or any("/" + f + ".framework/" in name for f in frameworks):
                  libraries.append(name)
          subprocess.run(["python3", "scripts/ios/make-tbds.py", "--cache", sys.argv[2], *libraries], check=True)
          PY
      - name: Build and verify the Metal bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("userland/metal/build.sh")
          s = p.read_text()
          key = "    (\"'-j6'\","
          if s.count(key) != 1:
              raise SystemExit("Turnip build script differs from the pinned source")
          fix = """    ("'-fstack-protector-strong']", "'-fstack-protector-strong', '-D_DARWIN_C_SOURCE=1']", "Darwin definitions for POSIX-generated sources"),
          """
          p.write_text(s.replace(key, fix.rstrip() + "\n" + key))
          PY
          if ! bash userland/metal/build.sh; then
            find out/metal -name '*-build.log' -exec tail -80 {} \;
            exit 1
          fi
          mkdir -p out/userland/metal-licenses
          cp external/NativeMetal/LICENSE out/userland/metal-licenses/NativeMetal.txt
          for f in external/metal2vulkan/LICENSE*; do cp "$f" "out/userland/metal-licenses/metal2vulkan-$(basename "$f").txt"; done
          cp external/mesa-droidvm/docs/license.rst out/userland/metal-licenses/Mesa.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OneiOS-Metal-24A446
          path: |
            runtime-source/out/userland/NativeAdrenoMetal.bundle/
            runtime-source/out/userland/NativeAdrenoMetal.gpuaddon
            runtime-source/out/userland/NativeAdrenoMetal.build.json
            runtime-source/out/userland/NativeAdrenoMetal.check.txt
            runtime-source/out/userland/metal-licenses/
          if-no-files-found: error
          retention-days: 30
  runtime:
    needs: metal
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: port
      - uses: actions/checkout@v4
        with:
          repository: akshaynexus/OneiOS
          ref: 7b81012615f2278460ffa3996aa56d6889277095
          path: runtime-source
      - name: Apply runtime changes
        working-directory: runtime-source
        run: |
          git apply --check ../port/patches/s25-plus-metal-runtime.patch
          git apply ../port/patches/s25-plus-metal-runtime.patch
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK and Rust target
        working-directory: runtime-source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd
          bash .github/scripts/setup-build.sh
      - name: Fetch pinned GPU renderer
        working-directory: runtime-source
        run: bash scripts/setup/get-references.sh virglrenderer
      - uses: actions/download-artifact@v4
        with:
          name: OneiOS-Metal-24A446
          path: metal
      - name: Stage the tested Metal add-on and its two CDHashes
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          source = Path("metal")
          record = json.loads((source / "NativeAdrenoMetal.build.json").read_text())
          if record["target"] != "iPhone18,2 24A446" or not record["stubs"]:
              raise SystemExit("Metal add-on targets the wrong guest or lacks link validation")
          hashes = [bytes.fromhex(h) for h in record["cdhashes"]]
          if len(hashes) != 2 or any(len(h) != 20 for h in hashes) or hashes[0] == hashes[1]:
              raise SystemExit("Metal add-on must identify two distinct binaries")
          addon = source / "NativeAdrenoMetal.gpuaddon"
          with addon.open("rb") as f:
              if f.read(8) != b"NGPUADD2" or addon.stat().st_size > 64 * 1024 * 1024:
                  raise SystemExit("Metal add-on does not fit the hosted runtime")
          dest = Path("metal-stage/lib/metal/24A446")
          dest.mkdir(parents=True)
          shutil.copyfile(addon, dest / addon.name)
          shutil.copyfile(source / "NativeAdrenoMetal.build.json", dest / "build.json")
          shutil.copytree(source / "metal-licenses", dest / "licenses")
          (dest / "cdhashes").write_bytes(b"".join(hashes))
          PY
      - name: Package Android runtime with Metal
        working-directory: runtime-source
        env:
          ONEIOS_BUILD_AEA: '1'
          PACKAGE_EXTRA_DIR: ${{ github.workspace }}/metal-stage
        run: bash runtime/package.sh 0.1.17-s25plus-metal
      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: OneiOS-S25Plus-Metal-Runtime
          path: |
            runtime-source/out/release/oneios-runtime-0.1.17-s25plus-metal-arm64.tar.zst
            runtime-source/out/release/oneios-runtime-0.1.17-s25plus-metal-arm64.tar.zst.sha256
          if-no-files-found: error
          retention-days: 30
