name: Build OneiOS S25+ runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-runtime.yml
      - patches/s25-plus-runtime.patch
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          path: port
      - uses: actions/checkout@v4
        with:
          repository: akshaynexus/OneiOS
          ref: 7b81012615f2278460ffa3996aa56d6889277095
          path: runtime-source
      - name: Apply runtime changes
        working-directory: runtime-source
        run: |
          git apply --check ../port/patches/s25-plus-runtime.patch
          git apply ../port/patches/s25-plus-runtime.patch
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK and Rust target
        working-directory: runtime-source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd
          bash .github/scripts/setup-build.sh
      - name: Fetch pinned GPU renderer
        working-directory: runtime-source
        run: bash scripts/setup/get-references.sh virglrenderer
      - name: Package Android runtime and AEA helper
        working-directory: runtime-source
        env:
          ONEIOS_BUILD_AEA: '1'
        run: bash runtime/package.sh 0.1.16-s25plus
      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: OneiOS-S25Plus-Runtime
          path: |
            runtime-source/out/release/oneios-runtime-0.1.16-s25plus-arm64.tar.zst
            runtime-source/out/release/oneios-runtime-0.1.16-s25plus-arm64.tar.zst.sha256
          if-no-files-found: error
          retention-days: 30
