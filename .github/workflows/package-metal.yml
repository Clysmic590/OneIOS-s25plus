name: Package OneiOS S25+ Metal runtime
on:
  workflow_call:
    inputs:
      metal_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      metal_run_id:
        description: "Run ID containing the verified 24A446 Metal bundle"
        default: "44822977313"
        type: string
  push:
    branches: [build/runtime-0.1.43]
    paths:
      - .github/workflows/package-metal.yml
permissions:
  actions: read
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: port
      - uses: actions/checkout@v4
        with:
          repository: akshaynexus/OneiOS
          ref: 7b81012615f2278460ffa3996aa56d6889277095
          path: runtime-source
      - name: Apply runtime changes
        working-directory: runtime-source
        run: |
          git apply --check ../port/patches/s25-plus-metal-runtime.patch
          git apply ../port/patches/s25-plus-metal-runtime.patch
          # OneiOS's direct-frame work, backported from upstream 10830a814.
          git apply --check ../port/patches/s25-display-direct.patch
          git apply ../port/patches/s25-display-direct.patch
          git apply --check ../port/patches/s25plus-frame-thermal-audio.patch
          git apply ../port/patches/s25plus-frame-thermal-audio.patch
          git apply --check ../port/patches/s25plus-display-fence-0.1.31.patch
          git apply ../port/patches/s25plus-display-fence-0.1.31.patch
          git apply --check ../port/patches/s25plus-copy-thermal-input-0.1.32.patch
          git apply ../port/patches/s25plus-copy-thermal-input-0.1.32.patch
          git apply --check ../port/patches/s25plus-wake-performance-0.1.33.patch
          git apply ../port/patches/s25plus-wake-performance-0.1.33.patch
          git apply --check ../port/patches/s25plus-lower-render-resolution-0.1.34.patch
          git apply ../port/patches/s25plus-lower-render-resolution-0.1.34.patch
          git apply --check ../port/patches/s25-series-render-resolution-0.1.35.patch
          git apply ../port/patches/s25-series-render-resolution-0.1.35.patch
          git apply --check ../port/patches/s25plus-thermal-governor-ram-0.1.36.patch
          git apply ../port/patches/s25plus-thermal-governor-ram-0.1.36.patch
          git apply --check ../port/patches/s25plus-ram-idle-apps-0.1.37.patch
          git apply ../port/patches/s25plus-ram-idle-apps-0.1.37.patch
          git apply --check ../port/patches/s25plus-thermal-stages-ram-0.1.38.patch
          git apply ../port/patches/s25plus-thermal-stages-ram-0.1.38.patch
          git apply --check ../port/patches/s25plus-touch-backlog-critical-heat-0.1.39.patch
          git apply ../port/patches/s25plus-touch-backlog-critical-heat-0.1.39.patch
          git apply --check ../port/patches/s25plus-keyboard-queue-0.1.40.patch
          git apply ../port/patches/s25plus-keyboard-queue-0.1.40.patch
          git apply --check ../port/patches/s25plus-gesture-start-0.1.41.patch
          git apply ../port/patches/s25plus-gesture-start-0.1.41.patch
          git apply --check ../port/patches/s25plus-earlier-cooling-ram-0.1.42.patch
          git apply ../port/patches/s25plus-earlier-cooling-ram-0.1.42.patch
          git apply --check ../port/patches/s25plus-manual-return-0.1.43.patch
          git apply ../port/patches/s25plus-manual-return-0.1.43.patch
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK and Rust target
        working-directory: runtime-source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd
          bash .github/scripts/setup-build.sh
      - name: Fetch pinned GPU renderer
        working-directory: runtime-source
        run: bash scripts/setup/get-references.sh virglrenderer
      - uses: actions/download-artifact@v4
        with:
          name: OneiOS-Metal-24A446
          path: metal
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.metal_run_id || '44822977313' }}
      - name: Stage the tested Metal add-on and its two CDHashes
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          source = Path("metal")
          record = json.loads((source / "NativeAdrenoMetal.build.json").read_text())
          if record.get("client_pooled_block_mib") != 32:
              raise SystemExit("Metal add-on must be built with 32 MiB app-client pools")
          if record["target"] != "iPhone18,2 24A446" or not record["stubs"]:
              raise SystemExit("Metal add-on targets the wrong guest or lacks link validation")
          hashes = [bytes.fromhex(h) for h in record["cdhashes"]]
          if len(hashes) != 2 or any(len(h) != 20 for h in hashes) or hashes[0] == hashes[1]:
              raise SystemExit("Metal add-on must identify two distinct binaries")
          addon = source / "NativeAdrenoMetal.gpuaddon"
          with addon.open("rb") as f:
              if f.read(8) != b"NGPUADD2" or addon.stat().st_size > 64 * 1024 * 1024:
                  raise SystemExit("Metal add-on does not fit the hosted runtime")
          dest = Path("metal-stage/lib/metal/24A446")
          dest.mkdir(parents=True)
          shutil.copyfile(addon, dest / addon.name)
          shutil.copyfile(source / "NativeAdrenoMetal.build.json", dest / "build.json")
          shutil.copytree(source / "metal-licenses", dest / "licenses")
          (dest / "cdhashes").write_bytes(b"".join(hashes))
          PY
      - name: Package Android runtime with Metal
        working-directory: runtime-source
        env:
          ONEIOS_BUILD_AEA: '1'
          PACKAGE_EXTRA_DIR: ${{ github.workspace }}/metal-stage
        run: bash runtime/package.sh 0.1.43-s25plusmetal
      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: OneiOS-S25Plus-Metal-Runtime-0.1.43
          path: |
            runtime-source/out/release/oneios-runtime-0.1.43-s25plusmetal-arm64.tar.zst
            runtime-source/out/release/oneios-runtime-0.1.43-s25plusmetal-arm64.tar.zst.sha256
          if-no-files-found: error
          retention-days: 30
