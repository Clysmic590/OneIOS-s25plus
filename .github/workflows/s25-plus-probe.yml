name: Collect S25+ GPU and Bluetooth probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S25+ port patch
        uses: actions/checkout@v4
        with:
          repository: Clysmic590/OneIOS-s25plus
          path: patch
      - name: Checkout upstream S25 probe source
        uses: actions/checkout@v4
        with:
          repository: xaxaapple/s25ver
          ref: 4b530c764978eff2f55ea5cfcc34a3125126d3c3
          path: source
      - name: Apply S25+ read-only probe support
        working-directory: source
        run: |
          git apply --check ../patch/patches/s25-plus-port.patch
          git apply ../patch/patches/s25-plus-port.patch
      - name: Package probe script
        run: |
          mkdir -p output
          cp source/tools/probe/s25-probe.sh output/s25-probe.sh
          cat > output/README.txt <<'EOF'
          S25+ read-only hardware probe

          1. Install Termux from its official source and install adb on your PC.
          2. Connect the rooted S25+ to the PC with USB debugging enabled.
          3. Run:
             adb push s25-probe.sh /data/local/tmp/
             adb shell su -c 'sh /data/local/tmp/s25-probe.sh s25-plus'
          4. The phone prints the archive path. Pull it with:
             adb pull /data/local/tmp/oneios-s25-plus-probe-<timestamp>.tar.gz .
          5. Share that archive here. It records hardware/driver diagnostics and does not change settings.
          EOF
      - name: Upload probe kit
        uses: actions/upload-artifact@v4
        with:
          name: S25Plus-GPU-Bluetooth-Probe
          path: output/
          if-no-files-found: error
          retention-days: 30